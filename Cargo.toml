[workspace]
members = [
    "crates/*"
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/djnovin/djnovin"
authors = ["Novin Noori <hello@novinnoori.com"]

[workspace.dependencies]
dioxus = { version = "0.7"}
serde = { version = "1.0.197", features = ["derive"] }