[workspace]
members = [
    "crates/*"
]
resolver = "2"

[workspace.package]
name = "djnovin-ui"
edition = "2024"
license = "MIT"
repository = "https://github.com/djnovin/djnovin-ui"
authors = ["Novin Noori <hello@novinnoori.com"]
keywords = ["ui"]
description = "Composable UI component library for Dioxus"

[workspace.dependencies]
dioxus = { version = "0.7"}
serde = { version = "1.0.197", features = ["derive"] }